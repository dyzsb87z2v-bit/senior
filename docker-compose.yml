# Production stack on one server: PostgreSQL + the app + Caddy (automatic HTTPS).
# `docker compose up -d --build`, then `docker compose exec app node dist/server/db/seed.js`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: senior_lunch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/senior_lunch
      HOST: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
  # HTTPS with an automatic Let's Encrypt certificate. Needs DOMAIN in .env and a DNS record pointing here.
  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
  caddy_config:
